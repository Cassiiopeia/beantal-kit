# Ubuntu, macOS, Windows 교차 검증: 테스트, skill 검증, 설치기 dry-run.
# develop push 와 main/develop 대상 PR 에서 실행되어 릴리스 전에 OS 별 문제를 잡는다.
name: BEANTAL-CI-MATRIX

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 테스트
        run: npm test

      - name: skill 검증
        run: npm run check

      - name: 설치기 dry-run (CLI 가 없는 환경의 건너뜀 경로 포함)
        run: node bin/beantal-kit.js --dry-run

      - name: 설치기 status
        run: node bin/beantal-kit.js status

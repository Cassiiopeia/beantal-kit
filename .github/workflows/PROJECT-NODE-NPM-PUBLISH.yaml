# npm 공개 레지스트리 자동 배포 (beantal-kit)
# - main 에 bin/, src/, package.json 이 바뀌어 push 되면 배포. 수동 실행도 가능.
# - 이미 배포된 버전이면 성공 종료(멱등). 버전 값은 package.json 의 version (projectops 설치 시 해당 워크플로우가 이 파일을 대체).
# - 필요 Secret: NPM_TOKEN (npm Automation/Granular Access Token, publish 권한)
name: PROJECT-NODE-NPM-PUBLISH

concurrency:
  group: npm-publish
  cancel-in-progress: false

on:
  push:
    branches: ["main"]
    paths: ["bin/**", "src/**", "package.json", ".github/workflows/PROJECT-NODE-NPM-PUBLISH.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-npm:
    name: npm 패키지 배포
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: 테스트와 skill 검증
        run: |
          npm test
          npm run check

      - name: 배포 여부 확인 (멱등)
        id: check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${VERSION} 은 이미 배포되어 있어 건너뜁니다."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: NPM_TOKEN 확인
        if: steps.check.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::error::NPM_TOKEN secret 이 없습니다"; exit 1; fi
          npm whoami

      - name: npm 배포
        if: steps.check.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
